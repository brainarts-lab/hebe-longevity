    <radialGradient id="glow" cx="0.78" cy="0.3" r="0.55"><stop offset="0" stop-color="#19b39c" stop-opacity=".32"/><stop offset="1" stop-color="#19b39c" stop-opacity="0"/></radialGradient>
    <linearGradient id="mk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#19b39c"/><stop offset="1" stop-color="#0a6e63"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#19b39c"/><stop offset="1" stop-color="#5fe3cc"/></linearGradient>
  </defs>
  <style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}</style>
  <rect width="1280" height="640" fill="url(#bg)"/>
