    <text x="32" y="372" font-size="16" font-weight="600" fill="#f5f7f7">2 studies verified · safety screened</text>
    <circle cx="372" cy="356" r="14" fill="#19b39c"/>
    <path d="M365 356l5 5 9-10" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
