    <text x="344" y="49" font-size="14" font-weight="600" text-anchor="middle" fill="#ffd66b">Demo data</text>
    <text x="30" y="128" font-size="72" font-weight="700" letter-spacing="-3" fill="#f5f7f7">37.2<tspan dx="14" font-size="22" font-weight="400" letter-spacing="0" fill="#a7c2bd">years</tspan></text>
    <text x="32" y="164" font-size="19" font-weight="600" fill="#5fe3cc">8.1 years younger than calendar age</text>

    <text x="32" y="214" font-size="15" fill="#a7c2bd">Blood PhenoAge</text>
    <text x="388" y="214" font-size="15" font-weight="600" text-anchor="end" fill="#f5f7f7">37.2</text>
